name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stardance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StarDanceSongSheet-Windows
            file: dist/StarDanceSongSheet.exe
          - os: macos-latest
            artifact: StarDanceSongSheet-macOS
            file: dist/StarDanceSongSheet-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos.command
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StarDanceSongSheet-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release with desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; keeping the published assets."
            exit 0
          fi
          gh release create "$release_tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "StarDance SongSheet Studio $release_tag" \
            --generate-notes
